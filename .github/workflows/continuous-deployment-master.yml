name: continuous-deployment-master.yml
on:
  push:
    branches:
      - master

jobs:
  deploy-db:
    name: Deploy Database
    uses: ./.github/workflows/cd-database-prod.yml
    secrets: inherit

  deploy-app:
    name: Build & Push GitHub Package & Deploy on AWS Lightsail
    needs: deploy-db
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🏷️ Extract GitHub Container Registry, repository (lowercase) & version from pom
        run: |
          echo "GHCR_URL=ghcr.io" >> $GITHUB_ENV
          echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      # 1º Crear Token de Acceso Personal:
      #    GitHub → Settings → Developer settings → Personal access tokens → Generate new token (classic)
      #    Permisos mínimos: write:packages, read:packages, delete:packages, repo
      # 2º Crear secret en GitHub:
      #    Repo → Settings → Secrets and variables → Actions → New repository secret
      #    Name: GHCR_PERSONAL_ACCESS_TOKEN, Value: <tu token>
      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:${{ env.VERSION }}
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY }}:latest

      - name: 🚀 Deploy on AWS Lightsail
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY_MAIN }}
          envs: GHCR_PAT,DB_PASSWORD
          command_timeout: 30m
          script: |
            echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker network create devopsNet || true
            docker pull ghcr.io/davidpaz06/iwvg-devops-paz-david:latest
            docker stop devops || true
            docker rm devops || true
            docker run -d --name devops --network devopsNet -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SPRING_DATABASE_URL="jdbc:postgresql://postgres:5432/iwvgdevopsdb" \
              -e SPRING_DATABASE_USERNAME="postgres" \
              -e SPRING_DATABASE_PASSWORD="$DB_PASSWORD" \
              -e JAVA_TOOL_OPTIONS="-Xmx256m" \
              ghcr.io/davidpaz06/iwvg-devops-paz-david:latest
        env:
          GHCR_PAT: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}